services:
  neo4j:
    image: neo4j:5-community
    # No explicit container_name - letting Docker Compose auto-namespace
    # by project folder (its default behavior) means two clones of this
    # repo in two different directories can run side by side without a
    # name collision. A hardcoded name here would force every clone to
    # fight over the exact same container name - found by exactly that
    # scenario during the Day 7 fresh-clone test, where a genuinely
    # fresh checkout couldn't start neo4j because the working copy's
    # container already held the name. Every documented command in this
    # repo uses `docker compose exec neo4j ...` (the SERVICE name, from
    # the YAML key below), never the container name directly, so this
    # is a safe removal - verified by grepping README.md, docs/*.md,
    # and scripts/*.py for any hardcoded reference before removing it.
    environment:
      - NEO4J_AUTH=neo4j/interopera_dev_only
      - NEO4J_PLUGINS=[]
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    # Same reasoning as neo4j above - no hardcoded container_name.
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=interopera_dev_only
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./sample_docs:/app/sample_docs:ro
      - ./configs:/app/configs:ro
    # Placeholder command until src/main.py exists (Day 5/6) — see
    # docs/00_project_plan.md for the build sequence.
    command: ["sleep", "infinity"]

volumes:
  neo4j_data:
