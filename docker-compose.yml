services:
  neo4j:
    image: neo4j:5-community
    container_name: interopera-takehome-neo4j
    environment:
      - NEO4J_AUTH=neo4j/interopera_dev_only
      - NEO4J_PLUGINS=[]
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: interopera-takehome-app
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=interopera_dev_only
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./sample_docs:/app/sample_docs:ro
      - ./configs:/app/configs:ro
    # Placeholder command until src/main.py exists (Day 5/6) — see
    # docs/00_project_plan.md for the build sequence.
    command: ["sleep", "infinity"]

volumes:
  neo4j_data:
